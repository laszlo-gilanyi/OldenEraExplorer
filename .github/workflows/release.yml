name: Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v0.7.1, v1.0.0, etc.

permissions:
  contents: write # Required for creating releases and uploading assets

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for changelog generation

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract version from tag
        id: version
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          # Remove 'v' prefix from tag to get version number
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build release packages
        run: node scripts/build-release.js ${{ steps.version.outputs.version }}

      - name: List generated packages
        run: |
          echo "Generated packages:"
          ls -lh dist/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/OldenEraExplorer-v${{ steps.version.outputs.version }}-win-x64.zip
            dist/OldenEraExplorer-v${{ steps.version.outputs.version }}-linux-x64.zip
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
